appId: com.codemind.desktop
productName: CodeMind
electronVersion: 43.0.0
publish:
  provider: github
  owner: symon9
  repo: code-mind
  releaseType: release
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - renderer/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CodeMind
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: assets/icons/icon.icns
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: assets/icons/icon.png
