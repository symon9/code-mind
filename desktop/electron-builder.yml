appId: com.codemind.desktop
productName: CodeMind
directories:
  output: dist-build
  buildResources: build
files:
  - electron/dist/**/*
  - react/dist/**/*
  - node_modules/**/*
  - package.json
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  target:
    - target: AppImage
      arch:
        - x64
